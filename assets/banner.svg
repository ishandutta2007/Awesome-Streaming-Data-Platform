<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Stream Line Gradients -->
    <linearGradient id="stream-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0" />
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="1" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="stream-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="1" />
      <stop offset="100%" stop-color="#e879f9" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="stream-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0" />
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="1" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glow-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0" />
    </radialGradient>

    <!-- Filters for Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes dashMove {
        0% {
          stroke-dashoffset: 600;
        }
        100% {
          stroke-dashoffset: 0;
        }
      }

      @keyframes pulseGlow {
        0%, 100% {
          opacity: 0.4;
          transform: scale(1);
        }
        50% {
          opacity: 0.85;
          transform: scale(1.08);
        }
      }

      @keyframes nodePulse {
        0%, 100% {
          r: 4px;
          opacity: 0.7;
        }
        50% {
          r: 6.5px;
          opacity: 1;
        }
      }

      .animated-stream-1 {
        stroke-dasharray: 80, 120;
        animation: dashMove 6s linear infinite;
      }

      .animated-stream-2 {
        stroke-dasharray: 60, 140;
        animation: dashMove 4.5s linear infinite reverse;
      }

      .animated-stream-3 {
        stroke-dasharray: 100, 100;
        animation: dashMove 7s linear infinite;
      }

      .pulse-node-1 {
        animation: nodePulse 2.5s ease-in-out infinite;
      }

      .pulse-node-2 {
        animation: nodePulse 3s ease-in-out infinite 0.7s;
      }

      .pulse-node-3 {
        animation: nodePulse 2s ease-in-out infinite 1.4s;
      }

      .glow-layer {
        transform-origin: center;
        animation: pulseGlow 5s ease-in-out infinite;
      }

      .banner-title {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }

      .banner-subtitle {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        letter-spacing: 0.3px;
      }

      .badge-tag {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        font-weight: 600;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="240" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="70" r="140" fill="url(#glow-cyan)" class="glow-layer" />
  <circle cx="760" cy="170" r="150" fill="url(#glow-purple)" class="glow-layer" />

  <!-- Background Grid lines -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.25">
    <line x1="60" y1="0" x2="60" y2="240" />
    <line x1="180" y1="0" x2="180" y2="240" />
    <line x1="300" y1="0" x2="300" y2="240" />
    <line x1="420" y1="0" x2="420" y2="240" />
    <line x1="540" y1="0" x2="540" y2="240" />
    <line x1="660" y1="0" x2="660" y2="240" />
    <line x1="780" y1="0" x2="780" y2="240" />
    <line x1="0" y1="60" x2="900" y2="60" />
    <line x1="0" y1="120" x2="900" y2="120" />
    <line x1="0" y1="180" x2="900" y2="180" />
  </g>

  <!-- Flowing Event Stream Curves -->
  <path d="M 40 40 C 220 100, 320 20, 520 70 S 740 40, 860 100" fill="none" stroke="url(#stream-cyan)" stroke-width="3" filter="url(#glow)" class="animated-stream-1" />
  <path d="M 40 200 C 180 140, 360 220, 560 170 S 720 210, 860 150" fill="none" stroke="url(#stream-purple)" stroke-width="2.5" filter="url(#glow)" class="animated-stream-2" />
  <path d="M 50 120 C 240 180, 400 60, 620 120 S 760 90, 860 60" fill="none" stroke="url(#stream-amber)" stroke-width="2" filter="url(#glow)" class="animated-stream-3" />

  <!-- Constellation Nodes & Pulses -->
  <circle cx="160" cy="65" r="5" fill="#38bdf8" class="pulse-node-1" filter="url(#glow)" />
  <circle cx="340" cy="135" r="4.5" fill="#c084fc" class="pulse-node-2" filter="url(#glow)" />
  <circle cx="530" cy="72" r="5" fill="#38bdf8" class="pulse-node-3" filter="url(#glow)" />
  <circle cx="680" cy="180" r="4.5" fill="#e879f9" class="pulse-node-1" filter="url(#glow)" />
  <circle cx="780" cy="75" r="4" fill="#fbbf24" class="pulse-node-2" filter="url(#glow)" />

  <!-- Center Branding Elements -->
  <g transform="translate(450, 80)">
    <!-- Hexagon Icon -->
    <g transform="translate(-320, -15)">
      <polygon points="28,4 52,18 52,46 28,60 4,46 4,18" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" filter="url(#glow)"/>
      <circle cx="28" cy="32" r="7" fill="#38bdf8" class="pulse-node-1" />
      <line x1="28" y1="12" x2="28" y2="25" stroke="#a855f7" stroke-width="2"/>
      <line x1="14" y1="40" x2="22" y2="35" stroke="#a855f7" stroke-width="2"/>
      <line x1="42" y1="40" x2="34" y2="35" stroke="#a855f7" stroke-width="2"/>
    </g>

    <!-- Title -->
    <text x="-240" y="24" class="banner-title" font-size="34" fill="url(#title-grad)" filter="url(#glow)">Awesome Streaming Data Platform</text>
    
    <!-- Subtitle -->
    <text x="-240" y="54" class="banner-subtitle" font-size="14" fill="#94a3b8">
      Curated Real-Time Event Brokers, Kafka Ecosystems, Stream Processing &amp; Pipelines
    </text>
  </g>

  <!-- Feature Pills / Badges at bottom -->
  <g transform="translate(180, 182)">
    <g transform="translate(0, 0)">
      <rect width="130" height="26" rx="13" fill="#1e293b" stroke="#0ea5e9" stroke-width="1" opacity="0.95" />
      <circle cx="14" cy="13" r="3.5" fill="#38bdf8" />
      <text x="26" y="17" class="badge-tag" fill="#bae6fd">Event Streaming</text>
    </g>

    <g transform="translate(142, 0)">
      <rect width="130" height="26" rx="13" fill="#1e293b" stroke="#8b5cf6" stroke-width="1" opacity="0.95" />
      <circle cx="14" cy="13" r="3.5" fill="#a78bfa" />
      <text x="26" y="17" class="badge-tag" fill="#ddd6fe">Kafka Protocol</text>
    </g>

    <g transform="translate(284, 0)">
      <rect width="145" height="26" rx="13" fill="#1e293b" stroke="#ec4899" stroke-width="1" opacity="0.95" />
      <circle cx="14" cy="13" r="3.5" fill="#f472b6" />
      <text x="26" y="17" class="badge-tag" fill="#fbcfe8">Stream Processing</text>
    </g>

    <g transform="translate(440, 0)">
      <rect width="130" height="26" rx="13" fill="#1e293b" stroke="#f59e0b" stroke-width="1" opacity="0.95" />
      <circle cx="14" cy="13" r="3.5" fill="#fbbf24" />
      <text x="26" y="17" class="badge-tag" fill="#fef3c7">S3-Native / BYOC</text>
    </g>
  </g>
</svg>
